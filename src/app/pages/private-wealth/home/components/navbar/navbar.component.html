@if(currentScreenSize === 'Small'){
<app-navbar-mobile
  [(isMobileMenuOpen)]="isMobileMenuOpen"
  [(isMobileSignInMenuOpen)]="isMobileSignInMenuOpen"
></app-navbar-mobile>
}@else if(currentScreenSize === 'Medium'){
<app-navbar-medium
  [(isMobileMenuOpen)]="isMobileMenuOpen"
  [(isMobileSignInMenuOpen)]="isMobileSignInMenuOpen"
></app-navbar-medium>
} @else if (currentScreenSize === 'Large'){
<app-navbar-large></app-navbar-large>
}
